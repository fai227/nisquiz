<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NISQUIZ</title>
</head>

<body>
    <main id="app">
        <!-- 1. タイトル画面 -->
        <section id="screen-title">
            <div>
                <div>
                    <img src="images/logo.svg" alt="NISQUIZ ロゴ" />
                    <form id="title-form">
                        <select id="title-select" name="titleSelect">
                            <option value="">選択してください</option>
                            <option value="1">項目1</option>
                            <option value="2">項目2</option>
                            <option value="3">項目3</option>
                        </select>
                        <button type="submit">開始</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- 2. 待機画面 -->
        <section id="screen-waiting" hidden>
            <div>
                <div>
                    <p>クイズ開始までしばらくお待ちください。</p>
                </div>
            </div>
        </section>

        <!-- 3. 択一クイズ画面 -->
        <section id="screen-choice" hidden>
            <div>
                <div>
                    <form id="choice-form">
                        <div>
                            <button type="button" value="1">選択肢1</button>
                        </div>
                        <div>
                            <button type="button" value="2">選択肢2</button>
                        </div>
                        <div>
                            <button type="button" value="3">選択肢3</button>
                        </div>
                        <div>
                            <button type="button" value="4">選択肢4</button>
                        </div>
                        <div>
                            <button type="submit">送信</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- 4. 入れ替えクイズ画面 -->
        <section id="screen-sortable" hidden>
            <div>
                <div>
                    <div id="sortable-area">
                        <ul id="sortable-list"></ul>
                    </div>
                    <form id="sortable-form">
                        <button type="submit">送信</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- 5. ジオゲッサークイズ画面 -->
        <section id="screen-geoguessr" hidden>
            <div>
                <div>
                    <canvas id="geoguessr-canvas" width="640" height="360"></canvas>
                    <form id="geoguessr-form">
                        <button type="submit">送信</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

<script src="app.js"></script>

</html>
