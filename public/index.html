<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NISQUIZ Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text: #1a1a1a;
            --color-purple: #7a4bb7;
            --color-purple-light: #cbb3ea;
            --color-blue: #1589f0;
            --color-lime: #c5f015;
        }

        * {
            box-sizing: border-box;
            font-family: 'Noto Sans JP', sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            color: var(--color-text);
        }

        h1 {
            color: var(--color-purple);
        }

        main {
            width: 100%;
            height: 100%;
        }

        .screen[hidden] {
            display: none;
        }

        .screen {
            width: 100%;
            height: 100%;
            position: relative;
            text-align: center;
        }

        .player-waiting {
            height: 100%;
            width: min(560px, 90vw);
            display: grid;
            justify-items: center;
            align-content: center;
            gap: 20px;
            margin: 0 auto;
        }

        .player-logo {
            width: min(420px, 75vw);
            height: auto;
            object-fit: contain;
        }

        .player-select {
            width: 100%;
            max-width: 420px;
            padding: 10px 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--color-purple-light);
            background: #fff;
            color: var(--color-text);
        }

        .player-join-button {
            width: 100%;
            max-width: 420px;
            padding: 12px 16px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            background: var(--color-purple);
            color: #fff;
            cursor: pointer;
        }

        .waiting-layout {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        .screen-with-banner {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .player-banner {
            width: 100%;
            min-height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 16px;
            background: #fff;
        }

        .banner-logo {
            width: 33vw;
            max-width: 180px;
            min-width: 110px;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .banner-meta {
            display: grid;
            justify-items: end;
            align-content: center;
            gap: 2px;
            color: #555;
            text-align: right;
        }

        .banner-player-name {
            color: var(--color-purple);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .banner-score {
            font-size: 0.95rem;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        .choice-layout {
            width: min(760px, 92vw);
            height: 100%;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 20px;
            padding: 20px 0 28px;
        }

        .choice-heading {
            display: grid;
            justify-items: center;
            gap: 4px;
            color: var(--color-purple);
        }

        .choice-heading-main {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .choice-heading-sub {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: #555;
        }

        .choice-options {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .choice-option-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .choice-option-label {
            width: 100%;
            min-height: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 14px;
            border-radius: 10px;
            background: #f3ecfb;
            color: var(--color-text);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .choice-option-label:hover {
            background: #ede2fa;
        }

        .choice-option-input:checked+.choice-option-label {
            background: #e1cff7;
            border-color: var(--color-purple);
        }

        .choice-option-num {
            flex-shrink: 0;
            color: var(--color-purple);
            font-size: 1rem;
            font-weight: 800;
        }

        .choice-option-text {
            flex: 1;
            text-align: center;
        }

        .choice-submit-button {
            width: 100%;
            min-height: 56px;
            border: none;
            border-radius: 10px;
            background: var(--color-purple);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .choice-answer-options {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .choice-answer-item {
            width: 100%;
            min-height: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 14px;
            border-radius: 10px;
            background: #f3ecfb;
            color: var(--color-text);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .choice-answer-item.correct {
            background: #c5f015;
        }

        .choice-answer-item.wrong {
            background: #ffb7b7;
        }

        .sortable-layout {
            width: min(760px, 92vw);
            height: 100%;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 20px;
            padding: 20px 0 28px;
        }

        .sortable-list {
            list-style: none;
            margin: 0;
            padding: 0;
            width: 100%;
            display: grid;
            gap: 10px;
        }

        .sortable-item {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border-radius: 10px;
            background: #f3ecfb;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: grab;
            user-select: none;
        }

        .sortable-item:active {
            cursor: grabbing;
        }

        @media (max-width: 640px) {
            .choice-options {
                grid-template-columns: 1fr;
            }

            .choice-answer-options {
                grid-template-columns: 1fr;
            }
        }

        .waiting-message {
            color: var(--color-purple);
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }

        .waiting-change-player {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            border: none;
            background: none;
            color: #555;
            font-size: 1rem;
            cursor: pointer;
        }

        .connection-lost {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.68);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            padding: 24px;
            z-index: 1000;
        }

        .connection-lost.show {
            display: flex;
        }
    </style>
</head>

<body>
    <div id="connection-lost" class="connection-lost">接続が切れました。ページをリロードします。</div>
    <main>
        <section id="screen-player-select" class="screen">
            <div class="player-waiting">
                <img src="images/logo.svg" alt="NISQUIZロゴ" class="player-logo" />
                <select id="player-select" class="player-select" aria-label="プレイヤー選択"></select>
                <button id="join-button" type="button" class="player-join-button">参加</button>
            </div>
        </section>

        <section id="screen-waiting" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="waiting-layout">
                    <p id="waiting-message" class="waiting-message"></p>
                </div>
            </div>
            <button id="change-player-button" class="waiting-change-player" type="button" hidden>プレイヤー変更</button>
        </section>

        <section id="screen-choice" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="screen-content">
                    <div class="choice-layout">
                        <div class="choice-heading">
                            <p class="choice-heading-main">N問目</p>
                            <p class="choice-heading-sub">- 択一クイズ -</p>
                        </div>

                        <div class="choice-options">
                            <input type="radio" id="choice-option-1" class="choice-option-input" name="choice-option"
                                value="1" />
                            <label for="choice-option-1" class="choice-option-label">
                                <span class="choice-option-num">1.</span>
                                <span class="choice-option-text">選択肢1</span>
                            </label>

                            <input type="radio" id="choice-option-2" class="choice-option-input" name="choice-option"
                                value="2" />
                            <label for="choice-option-2" class="choice-option-label">
                                <span class="choice-option-num">2.</span>
                                <span class="choice-option-text">選択肢2</span>
                            </label>

                            <input type="radio" id="choice-option-3" class="choice-option-input" name="choice-option"
                                value="3" />
                            <label for="choice-option-3" class="choice-option-label">
                                <span class="choice-option-num">3.</span>
                                <span class="choice-option-text">選択肢3</span>
                            </label>

                            <input type="radio" id="choice-option-4" class="choice-option-input" name="choice-option"
                                value="4" />
                            <label for="choice-option-4" class="choice-option-label">
                                <span class="choice-option-num">4.</span>
                                <span class="choice-option-text">選択肢4</span>
                            </label>
                        </div>

                        <button type="button" class="choice-submit-button">送信</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-choice-answer" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="screen-content">
                    <div class="choice-layout">
                        <div class="choice-heading">
                            <p id="choice-answer-question-number" class="choice-heading-main">N問目</p>
                            <p class="choice-heading-sub">- 択一クイズ -</p>
                        </div>

                        <div id="choice-answer-options" class="choice-answer-options"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-sortable" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="screen-content">
                    <div class="sortable-layout">
                        <div class="choice-heading">
                            <p id="sortable-question-number" class="choice-heading-main">N問目</p>
                            <p class="choice-heading-sub">- 入れ替えクイズ -</p>
                        </div>

                        <ul id="sortable-list" class="sortable-list" aria-label="入れ替え選択肢"></ul>
                        <button id="sortable-submit-button" type="button" class="choice-submit-button">送信</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-sortable-answer" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="screen-content">
                    <div class="choice-layout">
                        <div class="choice-heading">
                            <p id="sortable-answer-question-number" class="choice-heading-main">N問目</p>
                            <p class="choice-heading-sub">- 入れ替えクイズ -</p>
                        </div>

                        <div id="sortable-answer-options" class="choice-answer-options"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-geoguessr" class="screen" hidden>
            <div class="screen-with-banner">
                <header class="player-banner">
                    <img src="images/wide.svg" alt="バナー" class="banner-logo" />
                    <div class="banner-meta">
                        <div class="banner-player-name">プレイヤー未選択</div>
                        <div class="banner-score">スコア: 0点</div>
                    </div>
                </header>
                <div class="screen-content"
                    style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;">
                    <div class="choice-heading">
                        <p id="geoguessr-question-number" class="choice-heading-main">1問目</p>
                        <p class="choice-heading-sub">- ジオゲッサークイズ -</p>
                    </div>
                    <canvas id="geoguessr-canvas"
                        style="max-width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:crosshair;touch-action:none;"></canvas>
                    <button id="geoguessr-submit-button"
                        style="width:100%;max-width:320px;padding:14px;background:var(--color-purple);color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-family:inherit;cursor:pointer;">送信</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"
        integrity="sha512-csIng5zcB+XpulRUa+ev1zKo7zRNGpEaVfNB9On1no9KYTEY/rLGAEEpvgdw6nim1WdTuihZY1eqZ31K7/fZjw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        "use strict";

        const screenIds = [
            "screen-player-select",
            "screen-waiting",
            "screen-choice",
            "screen-choice-answer",
            "screen-sortable",
            "screen-sortable-answer",
            "screen-geoguessr",
        ];

        const screens = screenIds.map((id) => document.getElementById(id));
        const playerSelect = document.getElementById("player-select");
        const joinButton = document.getElementById("join-button");
        const waitingMessage = document.getElementById("waiting-message");
        const changePlayerButton = document.getElementById("change-player-button");
        const bannerPlayerNameEls = Array.from(document.querySelectorAll(".banner-player-name"));
        const bannerScoreEls = Array.from(document.querySelectorAll(".banner-score"));
        const choiceQuestionNumberEl = document.querySelector("#screen-choice .choice-heading-main");
        const choiceOptionInputs = Array.from(document.querySelectorAll("#screen-choice .choice-option-input"));
        const choiceOptionTextEls = Array.from(document.querySelectorAll("#screen-choice .choice-option-text"));
        const choiceSubmitButton = document.querySelector("#screen-choice .choice-submit-button");
        const choiceAnswerQuestionNumberEl = document.getElementById("choice-answer-question-number");
        const choiceAnswerOptionsEl = document.getElementById("choice-answer-options");
        const sortableQuestionNumberEl = document.getElementById("sortable-question-number");
        const sortableListEl = document.getElementById("sortable-list");
        const sortableSubmitButton = document.getElementById("sortable-submit-button");
        const sortableAnswerQuestionNumberEl = document.getElementById("sortable-answer-question-number");
        const sortableAnswerOptionsEl = document.getElementById("sortable-answer-options");
        const geoguessrQuestionNumberEl = document.getElementById("geoguessr-question-number");
        const geoguessrCanvas = document.getElementById("geoguessr-canvas");
        const geoguessrSubmitButton = document.getElementById("geoguessr-submit-button");
        const connectionLostEl = document.getElementById("connection-lost");
        const PLAYER_STORAGE_KEY = "nisquiz-player-name";

        let playersData = [];
        let currentPlayerId = null;
        let currentScore = 0;
        let currentChoiceQuestionNumber = 1;
        let currentChoiceOptions = [];
        let currentSortableQuestionNumber = 1;
        let currentSortableOptions = [];
        let sortableInstance = null;
        let geoguessrMapImage = null;
        let geoguessrPin = null;
        let geoguessrDragging = false;
        let geoguessrDragPos = null;
        let clientWs = null;

        function showScreen(index) {
            screens.forEach((screen, i) => {
                screen.hidden = i !== index;
            });
        }

        function updateBanner() {
            const selected = playersData.find((player) => String(player.id) === String(currentPlayerId));
            const playerLabel = selected ? selected.displayName : "プレイヤー未選択";
            bannerPlayerNameEls.forEach((el) => {
                el.textContent = playerLabel;
            });
            bannerScoreEls.forEach((el) => {
                el.textContent = `スコア: ${currentScore}点`;
            });
        }

        function changeScore(delta) {
            currentScore += Number(delta) || 0;
            updateBanner();
        }

        // options: string[]
        function showSortableScreen(options) {
            currentSortableQuestionNumber = 1;
            currentSortableOptions = [...options];
            sortableQuestionNumberEl.textContent = `${currentSortableQuestionNumber}問目`;
            sortableListEl.innerHTML = "";

            options.forEach((text, i) => {
                const item = document.createElement("li");
                item.className = "sortable-item";
                item.dataset.optionIndex = String(i + 1);

                const num = document.createElement("span");
                num.className = "choice-option-num";
                num.textContent = `${i + 1}.`;

                const label = document.createElement("span");
                label.className = "choice-option-text";
                label.textContent = text;

                item.appendChild(num);
                item.appendChild(label);
                sortableListEl.appendChild(item);
            });

            if (!sortableInstance) {
                sortableInstance = new Sortable(sortableListEl, {
                    animation: 120,
                });
            }

            showScreen(4);
        }

        // correctOrder: number[] (1-based)
        function showSortableAnswerScreen(correctOrder) {
            const submittedOrder = Array.from(sortableListEl.children).map((item) => Number(item.dataset.optionIndex));

            sortableAnswerQuestionNumberEl.textContent = `${currentSortableQuestionNumber}問目`;
            sortableAnswerOptionsEl.innerHTML = "";

            submittedOrder.forEach((optionIndex, position) => {
                const text = currentSortableOptions[optionIndex - 1] ?? "";
                const item = document.createElement("div");
                item.className = "choice-answer-item";

                if (optionIndex === correctOrder[position]) {
                    item.classList.add("correct");
                } else {
                    item.classList.add("wrong");
                }

                const num = document.createElement("span");
                num.className = "choice-option-num";
                num.textContent = `${optionIndex}.`;

                const label = document.createElement("span");
                label.className = "choice-option-text";
                label.textContent = text;

                item.appendChild(num);
                item.appendChild(label);
                sortableAnswerOptionsEl.appendChild(item);
            });

            showScreen(5);
        }

        // questionNumber: number, options: string[]
        function showChoiceScreen(questionNumber, options) {
            currentChoiceQuestionNumber = Number(questionNumber) || 1;
            currentChoiceOptions = [...options];

            choiceQuestionNumberEl.textContent = `${currentChoiceQuestionNumber}問目`;
            choiceOptionTextEls.forEach((el, i) => {
                const label = options[i] ?? "";
                el.textContent = label;
                const input = choiceOptionInputs[i];
                if (input) {
                    input.checked = false;
                    input.disabled = !label;
                }
            });
            showScreen(2);
        }

        // correctIndex: number (1-based)
        function showChoiceAnswerScreen(correctIndex) {
            const checkedInput = choiceOptionInputs.find((input) => input.checked);
            const selectedIndex = checkedInput ? Number(checkedInput.value) : null;

            choiceAnswerQuestionNumberEl.textContent = `${currentChoiceQuestionNumber}問目`;
            choiceAnswerOptionsEl.innerHTML = "";

            currentChoiceOptions.forEach((text, i) => {
                if (!text) {
                    return;
                }

                const index = i + 1;
                const item = document.createElement("div");
                item.className = "choice-answer-item";

                if (index === correctIndex) {
                    item.classList.add("correct");
                } else if (selectedIndex !== null && selectedIndex !== correctIndex && index === selectedIndex) {
                    item.classList.add("wrong");
                }

                const num = document.createElement("span");
                num.className = "choice-option-num";
                num.textContent = `${index}.`;

                const label = document.createElement("span");
                label.className = "choice-option-text";
                label.textContent = text;

                item.appendChild(num);
                item.appendChild(label);
                choiceAnswerOptionsEl.appendChild(item);
            });

            showScreen(3);
        }

        // message: string, showChangePlayer: boolean
        function showWaitingScreen(message, showChangePlayer) {
            waitingMessage.textContent = message;
            changePlayerButton.hidden = !showChangePlayer;
            showScreen(1);
        }

        function showTitleScreen() {
            showScreen(0);
        }

        function showChoiceQuizScreen(options) {
            showChoiceScreen(currentChoiceQuestionNumber, options);
        }

        function showSortableQuizScreen(options) {
            showSortableScreen(options);
        }

        function showGeoguessrQuizScreen() {
            showGeoguessrScreen();
        }

        // players: Array<{ id: string | number, displayName: string }>
        function showPlayerWaitingScreen(players) {
            playersData = [...players];
            playerSelect.innerHTML = "";
            players.forEach((player) => {
                const option = document.createElement("option");
                option.value = String(player.id);
                option.textContent = player.displayName;
                playerSelect.appendChild(option);
            });
        }

        function getWsUrl() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            return `${protocol}//${window.location.host}`;
        }

        function showConnectionLostAndReload() {
            connectionLostEl.classList.add("show");
            setTimeout(() => {
                window.location.reload();
            }, 1200);
        }

        async function fetchUserList() {
            const response = await fetch("/api/users", { method: "GET" });
            if (!response.ok) {
                throw new Error(`failed to fetch users: ${response.status}`);
            }
            const payload = await response.json();
            const users = Array.isArray(payload?.users) ? payload.users : [];
            return users
                .map((name) => String(name).trim())
                .filter((name) => name.length > 0)
                .map((name) => ({ id: name, displayName: name }));
        }

        function connectClientWs(userName) {
            if (clientWs && clientWs.readyState === WebSocket.OPEN) {
                return;
            }

            clientWs = new WebSocket(getWsUrl());

            clientWs.addEventListener("open", () => {
                clientWs.send(JSON.stringify({
                    type: "register",
                    role: "client",
                    userName,
                }));
                showWaitingScreen("開始までお待ちください", true);
            });

            clientWs.addEventListener("close", () => {
                showConnectionLostAndReload();
            });

            clientWs.addEventListener("error", () => {
                showConnectionLostAndReload();
            });
        }

        async function initializeApp() {
            const savedName = localStorage.getItem(PLAYER_STORAGE_KEY);

            if (savedName) {
                playersData = [{ id: savedName, displayName: savedName }];
                currentPlayerId = savedName;
                updateBanner();
                connectClientWs(savedName);
                return;
            }

            try {
                const users = await fetchUserList();
                showPlayerWaitingScreen(users);
                currentPlayerId = users[0]?.id ?? null;
                updateBanner();
                showTitleScreen();
            } catch (_error) {
                showConnectionLostAndReload();
            }
        }

        function getGeoguessrCanvasPos(clientX, clientY) {
            const rect = geoguessrCanvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (geoguessrCanvas.width / rect.width),
                y: (clientY - rect.top) * (geoguessrCanvas.height / rect.height),
            };
        }

        function drawGeoguessrCanvas() {
            if (!geoguessrMapImage) return;
            const ctx = geoguessrCanvas.getContext("2d");
            ctx.clearRect(0, 0, geoguessrCanvas.width, geoguessrCanvas.height);
            const scale = geoguessrCanvas.width / (geoguessrCanvas.getBoundingClientRect().width || 1);

            if (geoguessrDragging && geoguessrDragPos) {
                const zoom = 3;
                const srcW = geoguessrCanvas.width / zoom;
                const srcH = geoguessrCanvas.height / zoom;
                const maxX = geoguessrMapImage.width - srcW;
                const maxY = geoguessrMapImage.height - srcH;
                const sx = Math.max(0, Math.min(maxX, geoguessrDragPos.x - srcW / 2));
                const sy = Math.max(0, Math.min(maxY, geoguessrDragPos.y - srcH / 2));

                ctx.drawImage(geoguessrMapImage, sx, sy, srcW, srcH, 0, 0, geoguessrCanvas.width, geoguessrCanvas.height);

                const cx = geoguessrCanvas.width / 2;
                const cy = geoguessrCanvas.height / 2;
                const ch = 14 * scale;
                ctx.beginPath();
                ctx.moveTo(cx - ch, cy);
                ctx.lineTo(cx + ch, cy);
                ctx.moveTo(cx, cy - ch);
                ctx.lineTo(cx, cy + ch);
                ctx.strokeStyle = "#e53935";
                ctx.lineWidth = 2 * scale;
                ctx.stroke();
            } else {
                ctx.drawImage(geoguessrMapImage, 0, 0);
            }

            if (geoguessrPin && !geoguessrDragging) {
                const r = 12 * scale;
                ctx.beginPath();
                ctx.arc(geoguessrPin.x, geoguessrPin.y, r, 0, Math.PI * 2);
                ctx.fillStyle = "#7a4bb7";
                ctx.fill();
            }
        }

        function showGeoguessrScreen() {
            geoguessrQuestionNumberEl.textContent = "1問目";
            geoguessrPin = null;
            geoguessrDragging = false;
            geoguessrDragPos = null;
            if (geoguessrMapImage) {
                geoguessrCanvas.width = geoguessrMapImage.naturalWidth;
                geoguessrCanvas.height = geoguessrMapImage.naturalHeight;
                drawGeoguessrCanvas();
            } else {
                const img = new Image();
                img.onload = () => {
                    geoguessrMapImage = img;
                    geoguessrCanvas.width = img.naturalWidth;
                    geoguessrCanvas.height = img.naturalHeight;
                    drawGeoguessrCanvas();
                };
                img.src = "images/map.jpg";
            }
            showScreen(6);
        }

        joinButton.addEventListener("click", () => {
            const selected = playerSelect.value;
            if (!selected) {
                return;
            }

            currentPlayerId = selected;
            localStorage.setItem(PLAYER_STORAGE_KEY, selected);
            updateBanner();
            connectClientWs(selected);
        });

        changePlayerButton.addEventListener("click", () => {
            localStorage.removeItem(PLAYER_STORAGE_KEY);
            window.location.reload();
        });

        choiceSubmitButton.addEventListener("click", () => {
            showChoiceAnswerScreen(2);
        });

        sortableSubmitButton.addEventListener("click", () => {
            showSortableAnswerScreen([2, 1, 3, 4]);
        });

        geoguessrSubmitButton.addEventListener("click", () => {
            // placeholder: handle geoguessr submission
        });

        geoguessrCanvas.addEventListener("mousedown", (e) => {
            e.preventDefault();
            geoguessrDragging = true;
            geoguessrDragPos = getGeoguessrCanvasPos(e.clientX, e.clientY);
            drawGeoguessrCanvas();
        });
        geoguessrCanvas.addEventListener("mousemove", (e) => {
            if (!geoguessrDragging) return;
            geoguessrDragPos = getGeoguessrCanvasPos(e.clientX, e.clientY);
            drawGeoguessrCanvas();
        });
        geoguessrCanvas.addEventListener("mouseup", (e) => {
            if (!geoguessrDragging) return;
            geoguessrPin = getGeoguessrCanvasPos(e.clientX, e.clientY);
            geoguessrDragging = false;
            geoguessrDragPos = null;
            drawGeoguessrCanvas();
        });
        geoguessrCanvas.addEventListener("mouseleave", () => {
            if (geoguessrDragging) {
                geoguessrDragging = false;
                geoguessrDragPos = null;
                drawGeoguessrCanvas();
            }
        });
        geoguessrCanvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const t = e.touches[0];
            geoguessrDragging = true;
            geoguessrDragPos = getGeoguessrCanvasPos(t.clientX, t.clientY);
            drawGeoguessrCanvas();
        }, { passive: false });
        geoguessrCanvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const t = e.touches[0];
            geoguessrDragPos = getGeoguessrCanvasPos(t.clientX, t.clientY);
            drawGeoguessrCanvas();
        }, { passive: false });
        geoguessrCanvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            const t = e.changedTouches[0];
            geoguessrPin = getGeoguessrCanvasPos(t.clientX, t.clientY);
            geoguessrDragging = false;
            geoguessrDragPos = null;
            drawGeoguessrCanvas();
        }, { passive: false });
        geoguessrCanvas.addEventListener("touchcancel", () => {
            geoguessrDragging = false;
            geoguessrDragPos = null;
            drawGeoguessrCanvas();
        });

        window.changeScore = changeScore;
        window.showTitleScreen = showTitleScreen;
        window.showWaitingScreen = showWaitingScreen;
        window.showChoiceScreen = showChoiceScreen;
        window.showChoiceAnswerScreen = showChoiceAnswerScreen;
        window.showChoiceQuizScreen = showChoiceQuizScreen;
        window.showSortableScreen = showSortableScreen;
        window.showSortableAnswerScreen = showSortableAnswerScreen;
        window.showSortableQuizScreen = showSortableQuizScreen;
        window.showGeoguessrScreen = showGeoguessrScreen;
        window.showGeoguessrQuizScreen = showGeoguessrQuizScreen;

        initializeApp();
    </script>
</body>

</html>
